<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Update Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Live Dashboard</h1>
        <p>Information updates automatically</p>
      </div>
      <div class="live"><span></span> LIVE</div>
    </header>

    <section class="cards">
      <div class="card"><p>Current Balance</p><h2 id="balance">₹0</h2></div>
      <div class="card"><p>Pending Amount</p><h2 id="pending">₹0</h2></div>
      <div class="card"><p>Status</p><h2 id="status">Loading...</h2></div>
      <div class="card"><p>Last Updated</p><h2 id="time">--:--:--</h2></div>
    </section>

    <section class="update-box">
      <h2>Latest Update</h2>
      <p id="message">Connecting to live updates...</p>
      <div class="progress"><div id="progressBar"></div></div>
      <p class="small">Next automatic update in <b id="countdown">5</b> seconds</p>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
